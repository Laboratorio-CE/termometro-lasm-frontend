<div class="min-h-screen flex flex-col">
  <div class="sticky top-0 z-10 bg-papel">
    <header class="border-b border-linha">
      <div class="mx-auto max-w-180 px-5 h-18 flex items-center text-lg font-semibold text-roxo">
        {{title()}}
      </div>
    </header>

    <nav class="border-b border-linha">
      <ul class="mx-auto max-w-180 px-5 flex gap-6 overflow-x-auto">
        @for (aba of abas; track aba.rota) {
          <li>
            <a [routerLink]="aba.rota"
               routerLinkActive="border-roxo! font-medium text-roxo!"
               class="block py-3 whitespace-nowrap border-b-3 border-transparent text-tinta-suave hover:text-roxo">{{ aba.texto }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <main class="mx-auto w-full max-w-180 flex-1 px-5 py-6">
    <router-outlet />
  </main>
</div>
