<div class="min-h-screen bg-superficie px-5 py-16">
  <div class="mx-auto max-w-sm rounded-cartao border border-linha bg-papel p-8 shadow-sm">
    <p class="text-lg font-semibold text-roxo text-center">Termômetro LASM</p>
    <h1 class="text-sm text-tinta-suave mb-6 text-center">Painel administrativo</h1>

    <form (ngSubmit)="logar(campoEmail.value, campoSenha.value)" class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm font-medium">
        E-mail
        <input
          #campoEmail
          type="email"
          required
          autocomplete="username"
          [disabled]="bloqueado()"
          class="campo" />
      </label>

      <label class="flex flex-col gap-1 text-sm font-medium">
        Senha
        <input
          #campoSenha
          type="password"
          required
          autocomplete="current-password"
          [disabled]="bloqueado()"
          class="campo" />
      </label>

      @if (erro()) {
        <p role="alert" class="text-sm text-ambar-texto">{{ erro() }}</p>
      }

      <button type="submit" [disabled]="enviando() || bloqueado()" class="botao-primario mt-2">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
